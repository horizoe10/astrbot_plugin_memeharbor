name: astrbot_plugin_memeharbor
display_name: 表情港湾 MemeHarbor
author: horizoe10
version: "2.0.1"
short_desc: 表情包收集与群聊斗图助手：说「来张猫」就回图，换一张、以图回图、回序号取图，可视化后台让收藏的好图随叫随到。
desc: 群里看到好图就收下，想斗图时张口就来。表情港湾 MemeHarbor 是面向 AstrBot 各群聊平台的表情包收集与斗图插件：直接发标签或说「来张猫」就回图，可按群免 @；不满意说「换一张」，引用表情发「回一张」就回一张同类的；搜图预览回复序号就能取原图，搜不到会推荐相近标签；同一个群一段时间内不重复，少发被嫌弃的、多发被夸的。可选接梗模式、自动收集群里流行的图和群友投稿审核。2.0 全新网页后台：数字键逐张整理、标签合并与别名、群聊洞察、相似图片合并，每一步都能撤销，并定期自动备份。
tags:
  - 表情包
  - 斗图
  - 图片收集
  - 搜图
  - 图库管理
  - 标签管理
  - AI识图
  - OCR
  - 相似图片
repo: https://github.com/horizoe10/astrbot_plugin_memeharbor
astrbot_version: ">=4.29.0b1,<5"
