name: astrbot_plugin_memeharbor
display_name: 表情港湾 MemeHarbor
author: Ghostberry
version: "1.1.0"
short_desc: 表情包收集与群聊斗图助手：多标签搜图、随机发图、可视化图库，让收藏的好图随叫随到。
desc: 群里看到好图就收下，想斗图时按标签找出来。表情港湾 MemeHarbor 是面向 AstrBot 各群聊平台的表情包管理插件，支持图片收集与内容去重、多标签组合搜图、编号发图、随机斗图、防重复发送、GIF 动图、分页预览、批量标签管理、普通图片 ZIP 与整个文件夹导入、回收站和图库备份；还可按需开启 AI 识图、OCR 文字识别与自然语言搜图。把聊天里攒下的表情，变成随时可用的群聊表情库。
tags:
  - 表情包
  - 斗图
  - 图片收集
  - 搜图
  - 图库管理
  - 标签管理
  - AI识图
  - OCR
repo: https://github.com/horizoe10/astrbot_plugin_memeharbor
astrbot_version: ">=4.29.0b1,<5"
